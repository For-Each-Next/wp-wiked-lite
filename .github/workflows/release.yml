# @file .github/workflows/release.yml
# Purpose: .github / workflows / release module.
#
# Table of contents:
# 1. Workflow or configuration
# End file heading

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s dist/wiked_lite.min.js
          test -s dist/wiked_lite.user.js
          test -s dist/release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/wiked_lite.min.js \
              dist/wiked_lite.user.js \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "wikEd Lite ${RELEASE_TAG#v}" \
              --notes-file dist/release-notes.md \
              --draft=false \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" \
              dist/wiked_lite.min.js \
              dist/wiked_lite.user.js \
              --repo "$GITHUB_REPOSITORY" \
              --title "wikEd Lite ${RELEASE_TAG#v}" \
              --notes-file dist/release-notes.md \
              --verify-tag
          fi
